name: libbox
description: Dart and Flutter FFI bindings for the libbox native core.
version: 0.2.0
repository: https://github.com/loafman1120/libbox
issue_tracker: https://github.com/loafman1120/libbox/issues
topics:
  - ffi
  - flutter-ffi
  - sing-box

environment:
  sdk: ^3.4.0
  flutter: ">=3.22.0"

dependencies:
  ffi: ^2.1.3
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      windows:
        ffiPlugin: true
