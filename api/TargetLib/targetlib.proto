syntax = "proto3";

package targetlib;

option go_package = "github.com/loafman1120/TargetLib/api/TargetLib;targetlib";

import "google/protobuf/empty.proto";

service TargetLib {
  // Layer 1: Basic Proxy Control
  rpc Start(google.protobuf.Empty) returns (OperationResponse);
  rpc Restart(google.protobuf.Empty) returns (OperationResponse);
  rpc Stop(google.protobuf.Empty) returns (OperationResponse);
  rpc GetState(google.protobuf.Empty) returns (ServiceState);
  rpc SubscribeState(google.protobuf.Empty) returns (stream ServiceState);
  rpc SubscribeLogs(google.protobuf.Empty) returns (stream LogBatch);
  rpc SubscribeTraffic(TrafficRequest) returns (stream TrafficStatus);
  rpc CloseConnection(CloseConnectionRequest) returns (google.protobuf.Empty);
  rpc CloseAllConnections(google.protobuf.Empty) returns (google.protobuf.Empty);

  rpc ListSubscriptions(google.protobuf.Empty) returns (SubscriptionList);
  rpc GetSubscription(SubscriptionId) returns (SubscriptionView);
  rpc AddSubscription(AddSubscriptionRequest) returns (SubscriptionView);
  rpc RemoveSubscription(SubscriptionId) returns (google.protobuf.Empty);
  rpc RenameSubscription(RenameSubscriptionRequest) returns (SubscriptionView);
  rpc SetSubscriptionEnabled(SetSubscriptionEnabledRequest) returns (SubscriptionView);
  rpc ConfigureSubscriptionUpdates(ConfigureSubscriptionUpdatesRequest) returns (SubscriptionView);
  rpc UpdateSubscription(SubscriptionId) returns (SubscriptionUpdateResult);
  rpc GetResolvedEndpoints(ResolvedEndpointsRequest) returns (ResolvedEndpoints);
  rpc SubscribeSubscriptionEvents(google.protobuf.Empty) returns (stream SubscriptionEvent);

  rpc GetNodePool(google.protobuf.Empty) returns (NodePool);
  rpc SelectNode(SelectNodeRequest) returns (SelectNodeResponse);
  rpc GetProxyStatus(google.protobuf.Empty) returns (ProxyStatus);

  rpc GetRuntimeConfig(google.protobuf.Empty) returns (RuntimeConfig);
  rpc UpdateRuntimeConfig(UpdateRuntimeConfigRequest) returns (RuntimeConfig);
  rpc GetIpInfo(google.protobuf.Empty) returns (IpInfoResponse);

  // Layer 2: Rule-based Routing
  rpc UpsertRoute(UpsertRouteRequest) returns (RouteInfo);
  rpc DeleteRoute(DeleteRouteRequest) returns (google.protobuf.Empty);
  rpc ListRoutes(google.protobuf.Empty) returns (RouteList);
  rpc SelectRouteNode(SelectRouteNodeRequest) returns (SelectNodeResponse);
}

enum LogLevel {
  LOG_LEVEL_UNSPECIFIED = 0;
  LOG_LEVEL_PANIC = 1;
  LOG_LEVEL_FATAL = 2;
  LOG_LEVEL_ERROR = 3;
  LOG_LEVEL_WARN = 4;
  LOG_LEVEL_INFO = 5;
  LOG_LEVEL_DEBUG = 6;
  LOG_LEVEL_TRACE = 7;
}

message LogMessage {
  LogLevel level = 1;
  string message = 2;
}

message LogBatch {
  repeated LogMessage messages = 1;
  bool reset = 2;
}

message CloseConnectionRequest {
  string id = 1;
}

message OperationResponse {
  ServiceState state = 1;
}

enum ServiceStateType {
  SERVICE_STATE_UNSPECIFIED = 0;
  SERVICE_STATE_IDLE = 1;
  SERVICE_STATE_STARTING = 2;
  SERVICE_STATE_RUNNING = 3;
  SERVICE_STATE_STOPPING = 4;
  SERVICE_STATE_FAILED = 5;
}

message ServiceState {
  ServiceStateType state = 1;
  string error_message = 2;
  int64 changed_at_unix_ms = 3;
}

message TrafficRequest {
  uint32 interval_milliseconds = 1;
}

message TrafficStatus {
  bool available = 1;
  int64 upload_bytes_per_second = 2;
  int64 download_bytes_per_second = 3;
  int64 upload_total_bytes = 4;
  int64 download_total_bytes = 5;
  int32 inbound_connections = 6;
  int32 outbound_connections = 7;
  int64 sampled_at_unix_ms = 8;
  uint32 interval_milliseconds = 9;
}

message SubscriptionId {
  string id = 1;
}

message AddSubscriptionRequest {
  string id = 1;
  string name = 2;
  string url = 3;
  optional bool enabled = 4;
  optional bool auto_update = 5;
  int64 update_interval_seconds = 6;
  map<string, string> headers = 7;
  bool update_now = 9;
}

message RenameSubscriptionRequest {
  string id = 1;
  string name = 2;
}

message SetSubscriptionEnabledRequest {
  string id = 1;
  bool enabled = 2;
}

message ConfigureSubscriptionUpdatesRequest {
  string id = 1;
  bool enabled = 2;
  int64 update_interval_seconds = 3;
}

message ResolvedEndpointsRequest {
  bool enabled_only = 1;
}

message SubscriptionList {
  repeated SubscriptionView subscriptions = 1;
}

message SubscriptionView {
  string id = 1;
  string name = 2;
  string source = 3;
  bool enabled = 4;
  bool auto_update = 5;
  int64 update_interval_seconds = 6;
  SubscriptionStatus status = 7;
  SubscriptionUpdateStage stage = 8;
  ProfileView profile = 9;
  string error_code = 10;
  string error_message = 11;
  int64 updated_at_unix_ms = 12;
  int64 next_update_at_unix_ms = 13;
  int64 upload_bytes = 14;
  int64 download_bytes = 15;
  int64 total_bytes = 16;
  int64 expires_at_unix_ms = 17;
  string title = 18;
  string web_page_url = 19;
  string support_url = 20;
  string moved_permanently_to = 21;
}

message ProfileView {
  repeated ProfileNode nodes = 1;
}

message ProfileNode {
  string subscription_id = 10;
  string tag = 1;
  string name = 2;
  string type = 3;
  string server = 4;
  int32 port = 5;
  ProfileNodePhase phase = 7;
  string error_message = 8;
  string country_code = 9;
}

message SubscriptionUpdateResult {
  SubscriptionView subscription = 1;
  bool changed = 2;
  bool not_modified = 3;
  int64 duration_milliseconds = 4;
  bytes original_config = 5;
  bytes generated_config = 6;
}

enum ProxyMode {
  PROXY_MODE_UNSPECIFIED = 0;
  PROXY_MODE_MIXED = 1;
  PROXY_MODE_TUN = 2;
}

enum RouteMode {
  ROUTE_MODE_UNSPECIFIED = 0;
  ROUTE_MODE_DIRECT = 1;
  ROUTE_MODE_RULE = 2;
  ROUTE_MODE_ALL = 3;
}

message RuntimeSettings {
  string listen_address = 1;
  uint32 mixed_port = 2;
  ProxyMode proxy_mode = 3;
  bool ipv6 = 4;
  RouteMode route_mode = 5;
}

message RuntimeConfig {
  RuntimeSettings settings = 1;
  repeated SelectorConfig selectors = 2;
  repeated ServiceRoute service_routes = 3;
  string node_pool_revision = 6;
  reserved 4, 5;
  reserved "service_bindings", "revision";
}

message UpdateRuntimeConfigRequest {
  RuntimeSettings settings = 1;
  reserved 3;
  reserved "expected_revision";
}

message SelectorConfig {
  string tag = 1;
  repeated string node_ids = 2;
  string selected_node_id = 3;
  int64 selected_at_unix_ms = 4;
}

message ServiceRoute {
  string service_id = 1;
  repeated string domains = 2;
  string selector_tag = 3;
  bool enabled = 4;
  string display_name = 5;
}

message RuntimeModel {
  repeated SelectorConfig selectors = 1;
  repeated ServiceRoute service_routes = 2;
  reserved 3;
  reserved "service_bindings";
}

message NodePool {
  string revision = 1;
  repeated ProfileNode nodes = 2;
}

// Layer 1: Node Selection
message SelectNodeRequest {
  string node_id = 1;
}

message SelectNodeResponse {
  string node_id = 1;
  string node_name = 2;
  bool applied_immediately = 3;
  string error_message = 4;
}

message ProxyStatus {
  ServiceStateType service_state = 1;
  string selected_node_id = 2;
  string selected_node_name = 3;
  string actual_node_id = 4;
  bool effective = 5;
  int64 selected_at_unix_ms = 6;
  bool node_available = 7;
  string unavailable_reason = 8;
}

// Layer 2: Rule-based Routing
message UpsertRouteRequest {
  string service_id = 1;
  string display_name = 2;
  repeated string domains = 3;
  string node_id = 4;
  bool enabled = 5;
}

message RouteInfo {
  string service_id = 1;
  string display_name = 2;
  repeated string domains = 3;
  string selector_tag = 4;
  string current_node_id = 5;
  string current_node_name = 6;
  bool enabled = 7;
  bool effective = 8;
}

message DeleteRouteRequest {
  string service_id = 1;
}

message RouteList {
  repeated RouteInfo routes = 1;
  RouteInfo default_route = 2;
}

message SelectRouteNodeRequest {
  string service_id = 1;
  string node_id = 2;
}

message ResolvedEndpoints {
  repeated string addresses = 1;
}

message IpInfoResponse {
  string ip = 1;
  string country = 2;
  string country_code = 3;
  string city = 4;
  string isp = 5;
  string org = 6;
  string as_name = 7;
}

message SubscriptionEvent {
  SubscriptionEventType type = 1;
  SubscriptionView subscription = 2;
  int64 occurred_at_unix_ms = 3;
}

enum SubscriptionStatus {
  SUBSCRIPTION_STATUS_UNSPECIFIED = 0;
  SUBSCRIPTION_STATUS_IDLE = 1;
  SUBSCRIPTION_STATUS_UPDATING = 2;
  SUBSCRIPTION_STATUS_READY = 3;
  SUBSCRIPTION_STATUS_FAILED = 4;
}

enum SubscriptionUpdateStage {
  SUBSCRIPTION_UPDATE_STAGE_UNSPECIFIED = 0;
  SUBSCRIPTION_UPDATE_STAGE_IDLE = 1;
  SUBSCRIPTION_UPDATE_STAGE_FETCHING = 2;
  SUBSCRIPTION_UPDATE_STAGE_PARSING = 3;
  SUBSCRIPTION_UPDATE_STAGE_RESOLVING = 4;
  SUBSCRIPTION_UPDATE_STAGE_PERSISTING = 5;
  SUBSCRIPTION_UPDATE_STAGE_COMPLETE = 6;
  SUBSCRIPTION_UPDATE_STAGE_FAILED = 7;
}

enum ProfileNodePhase {
  PROFILE_NODE_PHASE_UNSPECIFIED = 0;
  PROFILE_NODE_PHASE_DISCOVERED = 1;
  PROFILE_NODE_PHASE_NORMALIZED = 2;
  PROFILE_NODE_PHASE_READY = 3;
  PROFILE_NODE_PHASE_FAILED = 4;
}

enum SubscriptionEventType {
  SUBSCRIPTION_EVENT_TYPE_UNSPECIFIED = 0;
  SUBSCRIPTION_EVENT_TYPE_ADDED = 1;
  SUBSCRIPTION_EVENT_TYPE_UPDATED = 2;
  SUBSCRIPTION_EVENT_TYPE_REMOVED = 3;
  SUBSCRIPTION_EVENT_TYPE_STAGE = 4;
}
